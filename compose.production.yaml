name: larple

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    LARP_STORAGE_DIR: /data
    LARP_JUDGE_MODE: ${LARP_JUDGE_MODE:-gemini}
    LARP_GEMINI_API_KEY: ${LARP_GEMINI_API_KEY:?Set LARP_GEMINI_API_KEY in deploy/.env}
    LARP_GEMINI_MODEL: ${LARP_GEMINI_MODEL:-gemini-3.8-flash}
    LARP_INVITE_CODE: ${LARP_INVITE_CODE:?Set a private LARP_INVITE_CODE in deploy/.env}
    LARP_MAX_DAILY_JOBS: ${LARP_MAX_DAILY_JOBS:-100}
    LARP_CORS_ORIGINS: '[]'
  volumes:
    - game-data:/data
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  api:
    <<: *backend
    # Only Caddy can be reached from outside this Docker network.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain in deploy/.env}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  game-data:
  caddy-data:
  caddy-config:
